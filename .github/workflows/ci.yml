name: Edvanta CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Code Lint Verification
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test
        env:
          VITE_API_BASE_URL: "http://localhost:5000"
          VITE_FIREBASE_API_KEY: "dummy-api-key-for-ci"
          VITE_FIREBASE_AUTH_DOMAIN: "edvanta-ci.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "edvanta-ci"
          VITE_FIREBASE_STORAGE_BUCKET: "edvanta-ci.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          VITE_FIREBASE_APP_ID: "1:1234567890:web:dummy"

      - name: Build Check
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:5000"
          VITE_FIREBASE_API_KEY: "dummy-api-key-for-ci"
          VITE_FIREBASE_AUTH_DOMAIN: "edvanta-ci.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "edvanta-ci"
          VITE_FIREBASE_STORAGE_BUCKET: "edvanta-ci.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          VITE_FIREBASE_APP_ID: "1:1234567890:web:dummy"

  backend-check:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: server/requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Backend Tests with Coverage
        run: pytest --cov=app --cov-report=term-missing tests/

