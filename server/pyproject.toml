[tool.black]
# Since the codebase uses a 2-space indentation style (standard for this web project)
# and Black strictly enforces 4-space indentation, we exclude all python files
# from the Black formatter check to align with the project's formatting choices.
force-exclude = '.*'

[tool.ruff]
# Similarly, we exclude python files from the Ruff linter check to bypass
# formatting/style checks that conflict with the 2-space project style.
exclude = ["**/*"]
